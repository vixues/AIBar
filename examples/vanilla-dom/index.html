<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIBar vanilla DOM</title>
  </head>
  <body>
    <div class="demo">
      <header>
        <h1>AIBar (no React)</h1>
        <p>
          <code>@aibar/core</code> + <code>@aibar/renderer-dom</code>. Click Send,
          then narrow the window to force overflow.
        </p>
      </header>
      <div class="stage">
        <div id="transcript" class="transcript">
          <div class="msg assistant">
            <span class="meta">assistant</span>
            Click Send, change Flash/Pro, drag temperature, or shrink the window until items overflow.
          </div>
        </div>
        <div class="composer">
          <div id="bar"></div>
          <textarea id="draft" rows="2" placeholder="Type a message, then press Send on the bar">Hello from a vanilla host</textarea>
        </div>
      </div>
      <p class="hint">Recent actions</p>
      <ul id="log"><li>Click Send on the bar…</li></ul>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
